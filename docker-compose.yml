services:
  # --- Next.js (フロントエンド) ---
  frontend:
    build:
      context: .
      dockerfile: Docker/frontend/dockerfile
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NEXT_WEBPACK_USEPOLLING: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8080
    networks:
      - app-network
    ports:
      - "3000:3000"
    command: npm run dev

  # --- Gin (バックエンド) ---
  backend:
    build:
      context: ./backend
      dockerfile: ../Docker/backend/dockerfile
    env_file:
      - ./backend/.env
    networks:
      - app-network
    ports:
      - "8080:8080"
    command: ./main
    depends_on:
      db:
        condition: service_healthy

  # --- MySQL ---
  db:
    image: mysql:8.0
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_DATABASE:-app_db}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_pass}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Test Database ---
  db_test:
    image: mysql:8.0
    restart: no
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    env_file:
      - ./.env.test
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_DATABASE:-app_db_test}
      MYSQL_USER: ${DB_USER:-app_user_test}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_pass_test}
    ports:
      - "3307:3306"
    volumes:
      - db_test_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Qdrant ---
  qdrant:
    image: qdrant/qdrant:v1.9.2
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app-network

volumes:
  db_data:
  db_test_data:
  qdrant_data:

networks:
  app-network:
    driver: bridge